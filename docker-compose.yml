services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: medmatch
      MYSQL_USER: medmatch
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run npm run setup}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run npm run setup}
    ports: ["127.0.0.1:3306:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysqladmin ping -h 127.0.0.1 -u root --silent']
      interval: 5s
      timeout: 5s
      retries: 20

  mongodb:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: medmatch_root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Run npm run setup}
    ports: ["127.0.0.1:27017:27017"]
    volumes:
      - mongo_data:/data/db
      - ./database/mongodb/setup.js:/docker-entrypoint-initdb.d/setup.js:ro
      - ./database/mongodb/model.json:/docker-entrypoint-initdb.d/model.json:ro

  qdrant:
    image: qdrant/qdrant:v1.19.0
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:?Run npm run setup}
    ports: ["127.0.0.1:6333:6333", "127.0.0.1:6334:6334"]
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  mysql_data:
  mongo_data:
  qdrant_data:
