services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: medmatch
      MYSQL_USER: medmatch
      MYSQL_PASSWORD: medmatch
      MYSQL_ROOT_PASSWORD: rootpassword
    ports: ["3306:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongodb:
    image: mongo:7
    ports: ["27017:27017"]
    volumes:
      - mongo_data:/data/db

  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports: ["6333:6333", "6334:6334"]
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  mysql_data:
  mongo_data:
  qdrant_data:
